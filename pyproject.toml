[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "votr"
version = "0.1.0"
description = "Voice of the Realm — local character voices for online tabletop GMs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Michael Cobb" }]
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.26",
    "sounddevice>=0.5",
    "python-stretch>=0.3",
    "pedalboard>=0.9",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
rubberband = [
    "rubband>=0.3",
]
bundle = [
    "pyinstaller>=6.0",
]
# E7 Neural Engine runtime (NVIDIA only). Install CUDA PyTorch first from the
# PyTorch index, e.g. pip install torch torchaudio --index-url
# https://download.pytorch.org/whl/cu128 — then pip install -e ".[neural]".
# X-VC pins older versions upstream; these ranges are what Michael's Python
# 3.13 box accepted (torch 2.9, transformers >= 4.46). wandb/tensorboard/
# matplotlib are imported by X-VC's utils/log.py at load time, not used.
neural = [
    "torch>=2.6",
    "torchaudio>=2.6",
    "transformers>=4.46",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "einops>=0.8",
    "einx>=0.3",
    "x-transformers>=1.40",
    "librosa>=0.10",
    "soundfile>=0.12",
    "soxr>=0.3",
    "descript-audiotools>=0.7",
    "scipy>=1.12",
    "matplotlib>=3.7",
    "tensorboard>=2.15",
    "wandb>=0.18",
    "tqdm>=4.66",
    "qwen-tts>=0.1.1",
    # descript-audiotools pins protobuf<3.20; onnxruntime/wandb/tensorboard
    # need >=6. Ask for the modern one so the resolver does not downgrade.
    "protobuf>=6.31.1,<8",
]

[project.scripts]
votr = "votr.__main__:main"

[project.urls]
Repository = "https://github.com/xamdxlonewolf/rpg_voice_npc_modulator"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
votr = ["assets/*.json", "assets/*.wav"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
